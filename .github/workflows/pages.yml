name: Test and deploy

# Runs the checks on every push and pull request, and publishes to GitHub Pages
# from the default branch.
#
# The deploy job turns Pages on itself (configure-pages with enablement), so
# there is nothing to click first. It still cannot work around a plan limit:
# Pages refuses a private repository unless the account has Pro, Team or
# Enterprise, and the fix for that is to make the repository public.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push and its pull request share a group, so the same commit is not tested
# twice, and a second push supersedes the first. The default branch is exempt,
# because cancelling it could interrupt a deploy that is already going out.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  test:
    name: Checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15   # the suite takes about 90 seconds; anything near this is a hang
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Playwright pins a browser build per release, so the cache key is the
      # resolved version rather than the lockfile hash.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # An iPhone 6 tops out at Safari 12, so anything newer has to be behind a
      # detection in assets/js/capabilities.js.
      - name: Safari 12 compatibility check
        run: npm run check

      - name: Tag reader tests
        run: npm run test:tags

      - name: Browser tests
        run: npm run test:browser

      # Builds the real artifact and exercises it the way Pages serves it: from
      # a subdirectory, then with the network switched off.
      - name: Deployment shape and offline tests
        run: npm run test:pages

  deploy:
    name: Deploy to Pages
    needs: test
    # Only the default branch publishes, whatever it happens to be called.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write      # also lets configure-pages enable Pages on first run
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false   # never cancel a deploy that is already going out
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Copies only what belongs on a phone, and refuses to publish a site whose
      # script tags and service worker shell list disagree with each other.
      - name: Build the site
        run: node scripts/build-site.js

      # enablement creates the Pages site on the first run instead of failing
      # with "Pages site not found". It is a no-op once Pages exists.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
